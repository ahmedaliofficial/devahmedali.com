services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Compose reads .env for interpolation, so setting these there is enough
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
    restart: always
    ports:
      # Change 3061 to whatever host port you want; the app always listens on
      # 3000 inside the container.
      - '3061:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
